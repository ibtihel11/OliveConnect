spring:
  application:
    name: OliveConnect

  mongodb:
    uri: mongodb://localhost:27017/oliveconnect

  data:
    mongodb:
      auto-index-creation: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

oliveconnect:
  jwt:
    # HS256, au moins 32 caractères. A surcharger en prod : OLIVECONNECT_JWT_SECRET
    # Doit être IDENTIQUE à la clé utilisée par M1 pour signer les tokens.
    secret: ${OLIVECONNECT_JWT_SECRET:dev-only-secret-change-me-0123456789-abcdef}
    expiration-minutes: 120
  cors:
    allowed-origins: http://localhost:3000,http://localhost:4200,http://localhost:5173
  carte:
    cache-ttl-ms: 30000
  simulation:
    enabled: false
    interval-ms: 60000
    initial-delay-ms: 10000
  seed:
    enabled: true
